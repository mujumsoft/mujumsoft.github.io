id: html

scopes:

queries: 

dataTypes:
    date:
        formats:
            full: 
                format: "yyyy/MM/dd"
            year: 
                format: "y"

contentTypes: 
    include:
        - page
        - privacy

iterators:

transformers:

engine: 
    id: mustache
    options:
        contentTypes: 
            page:
                view: "pages.default"
            privacy:
                view: "pages.privacy"
output:
    path: "{{slug}}"
    file: index
    ext: html
